name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile sources
        run: python -m compileall -q custom_components tests

      - name: Validate JSON
        run: |
          python -m json.tool custom_components/afterburner_helper/manifest.json >/dev/null
          python -m json.tool custom_components/afterburner_helper/strings.json >/dev/null
          python -m json.tool custom_components/afterburner_helper/translations/en.json >/dev/null

