title: Climate Control
views:
  - title: Climate
    path: climate
    icon: mdi:home-thermometer
    badges: []
    cards:
      - type: thermostat
        entity: climate.climate_control_afterburner_heat_group
        name: All Heaters
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
      - type: markdown
        title: Temperature Model
        content: >-
          {% set values = state_attr('sensor.climate_control_fused_room_temperature', 'active_sources') or {} %}
          **Sensors used now**

          {% for entity_id, value in values.items() %}
          - `{{ entity_id }}`: **{{ value }} °C**
          {% endfor %}

          **Calculation:** {{ state_attr('sensor.climate_control_fused_room_temperature', 'calculation') }}

          **Virtual room temperature:** {{ states('sensor.climate_control_fused_room_temperature') }} °C

          **Outdoor reference:** {{ states('sensor.climate_control_outdoor_temperature_reference') }} °C

          **Demand − outdoor:** {{ states('sensor.climate_control_outdoor_to_demand_delta') }} °C

          **Indoor − outdoor:** {{ states('sensor.climate_control_indoor_to_outdoor_delta') }} °C
      - type: entities
        title: Temperature References
        show_header_toggle: false
        entities:
          - entity: sensor.climate_control_fused_room_temperature
            name: Virtual fused room temperature
          - entity: sensor.climate_control_outdoor_temperature_reference
            name: Outdoor reference
          - entity: sensor.climate_control_outdoor_to_demand_delta
            name: Demand minus outdoor
          - entity: sensor.climate_control_indoor_to_outdoor_delta
            name: Indoor minus outdoor
      - type: entities
        title: Heat Staging
        show_header_toggle: false
        entities:
          - entity: sensor.climate_control_fused_room_temperature
            name: Fused room temperature
          - entity: select.climate_control_afterburner_heat_source_priority
            name: Demand order
          - entity: switch.climate_control_afterburner_electric_heater_1_lockout
            name: Lock out Electric Heater 1
          - entity: switch.climate_control_afterburner_electric_heater_2_lockout
            name: Lock out Electric Heater 2
          - entity: switch.climate_control_afterburner_diesel_lockout
            name: Lock out Diesel Heater
      - type: thermostat
        entity: climate.climate_control_afterburner_electric_heater_1
        name: Electric Heater 1
        features:
          - type: climate-hvac-modes
            hvac_modes: ["off", heat, auto]
      - type: thermostat
        entity: climate.climate_control_afterburner_electric_heater_2
        name: Electric Heater 2
        features:
          - type: climate-hvac-modes
            hvac_modes: ["off", heat, auto]
      - type: thermostat
        entity: climate.climate_control_afterburner_diesel_heater
        name: Diesel Heater
        features:
          - type: climate-hvac-modes
            hvac_modes: ["off", heat, auto]

  - title: Diesel Heater
    path: diesel-heater
    icon: mdi:radiator
    badges: []
    cards:
      - type: thermostat
        entity: climate.afterburner
        name: Diesel Heater
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
      - type: gauge
        entity: sensor.rv_diesel_heater_helper_fuel_remaining_percent
        name: Calibrated Diesel Fuel
        needle: true
        severity:
          green: 50
          yellow: 20
          red: 0
      - type: entities
        title: Fuel
        show_header_toggle: false
        entities:
          - entity: sensor.rv_diesel_heater_helper_fuel_remaining
            name: Fuel remaining
          - entity: sensor.rv_diesel_heater_helper_fuel_rate
            name: Current burn rate
          - entity: sensor.rv_diesel_heater_helper_fuel_runtime_at_current_rate
            name: Runtime at current rate
          - entity: sensor.rv_diesel_heater_helper_fuel_runtime_at_maximum_rate
            name: Runtime at maximum rate
          - entity: sensor.afterburner_fuel_used
            name: Raw controller fuel used (calibration)
      - type: entities
        title: Fuel Cost
        show_header_toggle: false
        entities:
          - entity: number.rv_diesel_heater_helper_diesel_price_per_litre
            name: Diesel price
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_per_hour
            name: Current cost per hour
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_per_24h_at_current_output
            name: 24h at current output
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_per_30d_at_current_output
            name: 30d at current output
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_per_hour_at_maximum_output
            name: Maximum cost per hour
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_per_30d_at_maximum_output
            name: 30d at maximum output
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_used_since_reset
            name: Cost this tank interval
          - entity: sensor.rv_diesel_heater_helper_fuel_cost_recorded_total
            name: Recorded total cost
          - entity: sensor.rv_diesel_heater_helper_fuel_value_remaining
            name: Remaining fuel value
          - entity: sensor.rv_diesel_heater_helper_full_tank_cost
            name: Full tank cost
      - type: entities
        title: Heater Status
        show_header_toggle: false
        entities:
          - entity: sensor.afterburner_temperature_3
            name: Room temperature
          - entity: sensor.afterburner_desired
            name: Requested temperature
          - entity: sensor.afterburner_heater_temperature
            name: Heat exchanger temperature
          - entity: sensor.afterburner_run_state
            name: Run state
          - entity: sensor.afterburner_error_state
            name: Controller status
          - entity: sensor.afterburner_pump_speed
            name: Pump frequency
          - entity: sensor.afterburner_fan_speed
            name: Fan speed
          - entity: sensor.afterburner_input_voltage
            name: Input voltage
      - type: entities
        title: Automatic Control
        show_header_toggle: false
        entities:
          - entity: sensor.rv_diesel_heater_helper_control_state
            name: Controller state
          - entity: sensor.rv_diesel_heater_helper_control_recommendation
            name: Current action
          - entity: sensor.rv_diesel_heater_helper_recovery_state
            name: Recovery state
          - entity: sensor.rv_diesel_heater_helper_flameout_warning
            name: Flame stability
      - type: entities
        title: Occupancy
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.diesel_heater_occupancy_climate_mode
            name: Current mode
          - entity: person.datalore
            name: Phone presence
          - entity: input_boolean.diesel_heater_occupancy_control
            name: Occupancy control
          - entity: input_boolean.diesel_heater_guest_mode
            name: Guest mode
          - entity: input_number.diesel_heater_home_temperature
            name: Home temperature
          - entity: input_number.diesel_heater_away_temperature
            name: Away temperature
          - entity: input_number.diesel_heater_away_delay
            name: Departure delay
      - type: history-graph
        title: Temperature History
        hours_to_show: 24
        entities:
          - entity: sensor.climate_control_fused_room_temperature
            name: Fused room
          - entity: sensor.igneous_bedroom_temperature_ds18b20_2
            name: Bedroom
          - entity: sensor.afterburner_temperature_3
            name: Heater room
          - entity: sensor.afterburner_desired
            name: Requested
          - entity: sensor.afterburner_heater_temperature
            name: Heat exchanger
          - entity: sensor.climate_control_outdoor_temperature_reference
            name: Outdoor
      - type: history-graph
        title: Fuel Demand History
        hours_to_show: 24
        entities:
          - entity: sensor.afterburner_pump_speed
            name: Pump frequency
          - entity: sensor.rv_diesel_heater_helper_fuel_rate
            name: Calculated burn rate

  - title: Electric Heaters
    path: electric-heaters
    icon: mdi:radiator-disabled
    badges: []
    cards:
      - type: entities
        title: Electric Heater Configuration
        show_header_toggle: false
        entities:
          - entity: select.climate_control_afterburner_heat_source_priority
            name: Heat source priority
          - entity: switch.climate_control_afterburner_electric_heater_1_lockout
          - entity: switch.climate_control_afterburner_electric_heater_2_lockout
          - entity: switch.climate_control_afterburner_diesel_lockout
      - type: thermostat
        entity: climate.climate_control_afterburner_electric_heater_1
        name: Electric Heater 1
      - type: thermostat
        entity: climate.climate_control_afterburner_electric_heater_2
        name: Electric Heater 2
      - type: markdown
        title: Smart-plug Assignment
        content: >-
          Smart-plug targets are selected under Settings → Devices & services →
          Afterburner Helper → Configure. Electric Heater 1 defaults to
          switch.s31_3_sonoff_s31_relay; Electric Heater 2 is optional.
      - type: entities
        title: Room Temperature Fusion
        show_header_toggle: false
        entities:
          - entity: sensor.climate_control_fused_room_temperature
            name: Fused room temperature
          - entity: sensor.afterburner_temperature_3
            name: Heater room sensor
          - entity: sensor.igneous_bedroom_temperature_ds18b20_2
            name: Bedroom sensor
      - type: markdown
        title: Temperature Sensor Assignment
        content: >-
          Choose any number of temperature sensors under Settings → Devices &
          services → Afterburner Helper → Configure. Enable “Use fused
          temperature” to drive the main climate control from their average,
          or disable it to use the selected single room-temperature sensor.

  - title: Thermostat & Cyclic
    path: thermostat-cyclic
    icon: mdi:thermostat-cog
    badges: []
    cards:
      - type: entities
        title: Thermostat
        show_header_toggle: false
        entities:
          - entity: switch.afterburner_thermostat_enable
            name: Thermostat enabled
          - entity: select.afterburner_thermostat_control_method
            name: Controller thermostat method
          - entity: sensor.climate_control_fused_room_temperature
            name: Fused room temperature
          - entity: sensor.afterburner_desired
            name: Temperature demand
          - entity: number.afterburner_thermostat_window
            name: Thermostat window
      - type: entities
        title: Cyclic Start / Stop
        show_header_toggle: false
        entities:
          - entity: number.afterburner_cyclic_start_offset
            name: Start offset
          - entity: number.afterburner_cyclic_stop_offset
            name: Stop offset
          - entity: number.afterburner_cyclic_pivot_temperature
            name: Pivot temperature
          - entity: binary_sensor.afterburner_run_request
            name: Run request
      - type: history-graph
        title: Thermostat History
        hours_to_show: 24
        entities:
          - entity: sensor.afterburner_temperature_3
            name: Room
          - entity: sensor.afterburner_desired
            name: Demand
          - entity: sensor.afterburner_desired_pump_speed
            name: Requested pump speed

  - title: Frost Protection
    path: frost-protection
    icon: mdi:snowflake-thermometer
    badges: []
    cards:
      - type: entities
        title: Frost Mode
        show_header_toggle: false
        entities:
          - entity: number.afterburner_frost_start_temperature
            name: Start temperature (0 disables)
          - entity: number.afterburner_frost_temperature_rise
            name: Temperature rise before stopping

  - title: Fuel & Mixture
    path: fuel-mixture
    icon: mdi:fuel
    badges: []
    cards:
      - type: entities
        title: Live Fuel Data
        show_header_toggle: false
        entities:
          - entity: sensor.afterburner_pump_speed
            name: Actual pump frequency
          - entity: sensor.afterburner_desired_pump_speed
            name: Requested pump frequency
          - entity: sensor.afterburner_fan_speed
            name: Fan speed
          - entity: sensor.afterburner_fuel_rate
            name: Controller fuel rate
          - entity: sensor.rv_diesel_heater_helper_fuel_rate
            name: Calibrated fuel rate
          - entity: sensor.afterburner_fuel_used
            name: Fuel used since reset
          - entity: sensor.afterburner_total_fuel_used
            name: Controller lifetime fuel
      - type: entities
        title: Active Mixture Map
        show_header_toggle: false
        entities:
          - entity: number.afterburner_minimum_pump_frequency
            name: Minimum pump frequency
          - entity: number.afterburner_minimum_fan_speed
            name: Minimum fan speed
          - entity: number.afterburner_maximum_pump_frequency
            name: Maximum pump frequency
          - entity: number.afterburner_maximum_fan_speed
            name: Maximum fan speed
          - entity: button.afterburner_refresh_settings
            name: Refresh controller settings
      - type: entities
        title: Fuel Calibration
        show_header_toggle: false
        entities:
          - entity: number.afterburner_tank_capacity
            name: Tank capacity
          - entity: number.afterburner_pump_volume_per_stroke
            name: Pump volume per stroke
          - entity: number.rv_diesel_heater_helper_diesel_price_per_litre
            name: Diesel price
          - entity: button.afterburner_reset_fuel_usage
            name: Reset controller fuel usage
      - type: markdown
        title: Alternate Mixture Maps
        content: >-
          The active map is now editable and saved persistently through MQTT.
          The four altitude-indexed alternate maps still require additional
          firmware command support and will be added here when available.
      - type: entities
        title: Controller Hardware Calibration
        show_header_toggle: false
        entities:
          - entity: select.afterburner_fan_sensor_type
          - entity: select.afterburner_system_voltage
          - entity: number.afterburner_low_voltage_cutout

  - title: Timers
    path: timers
    icon: mdi:timer-cog-outline
    badges: []
    cards:
      - type: markdown
        title: Afterburner Timers
        content: >-
          This page is reserved for the Afterburner's fourteen scheduled timers,
          including weekday selection, start/stop time, temperature commands,
          GPIO actions, and repeat/once operation. The current Afterburner MQTT
          discovery does not expose timer programming yet.

  - title: GPIO
    path: gpio
    icon: mdi:chip
    badges: []
    cards:
      - type: entities
        title: Inputs
        show_header_toggle: false
        entities:
          - entity: sensor.afterburner_gpio_input_1
          - entity: sensor.afterburner_gpio_input_1_mode
          - entity: sensor.afterburner_gpio_input_2
          - entity: sensor.afterburner_gpio_input_2_mode
          - entity: sensor.afterburner_gpio_analog_input
            name: Analogue input
          - entity: sensor.afterburner_gpio_analog_mode
      - type: entities
        title: User Outputs
        show_header_toggle: false
        entities:
          - entity: switch.afterburner_gpio_output_1
            name: GPIO output 1
          - entity: sensor.afterburner_gpio_output_1_mode
          - entity: number.afterburner_gpio_output_1_threshold
          - entity: switch.afterburner_gpio_output_2
            name: GPIO output 2
          - entity: sensor.afterburner_gpio_output_2_mode
          - entity: number.afterburner_gpio_output_2_threshold
      - type: markdown
        title: GPIO Configuration
        content: >-
          Live GPIO states, user outputs, modes, analogue input, and output
          thresholds now come directly from Afterburner MQTT. Firmware does not
          currently expose MQTT commands for changing the pin modes themselves.

  - title: System
    path: system
    icon: mdi:cog-outline
    badges: []
    cards:
      - type: entities
        title: Controller Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.afterburner_run_state
            name: Run state
          - entity: sensor.afterburner_error_state
            name: Controller status
          - entity: sensor.afterburner_input_voltage
            name: Input voltage
          - entity: sensor.afterburner_glow_plug_voltage
            name: Glow plug voltage
          - entity: sensor.afterburner_glow_plug_current
            name: Glow plug current
          - entity: sensor.afterburner_controller_altitude
            name: Reported altitude
          - entity: sensor.afterburner_controller_humidity
          - entity: sensor.afterburner_fan_voltage
          - entity: sensor.afterburner_configured_system_voltage
          - entity: sensor.afterburner_blue_wire_status
          - entity: sensor.afterburner_heater_temperature
            name: Heat exchanger temperature
      - type: entities
        title: Environmental Sensor Calibration
        show_header_toggle: false
        entities:
          - entity: number.afterburner_temperature_1_offset
          - entity: number.afterburner_temperature_2_offset
          - entity: number.afterburner_temperature_3_offset
          - entity: number.afterburner_temperature_4_offset
          - entity: button.afterburner_refresh_settings
            name: Refresh controller settings
      - type: entities
        title: Service Functions
        show_header_toggle: false
        entities:
          - entity: button.afterburner_prime_pump
            name: Prime fuel pump
          - entity: button.afterburner_refresh_system_information
            name: Refresh system information
          - entity: button.afterburner_reboot_controller
            name: Reboot Afterburner controller
      - type: entities
        title: Firmware and Runtime
        show_header_toggle: false
        entities:
          - entity: sensor.afterburner_controller_firmware_version
          - entity: sensor.afterburner_controller_firmware_date
          - entity: sensor.afterburner_controller_uptime
          - entity: sensor.afterburner_controller_free_memory
          - entity: sensor.afterburner_heater_accumulated_runtime
          - entity: sensor.afterburner_glow_plug_accumulated_runtime
      - type: markdown
        title: Remaining System Settings
        content: >-
          Firmware update, timer editing, GPIO mode assignment, communications,
          log streaming, and the virtual console remain future work. Network
          credentials will not be displayed on this dashboard.
